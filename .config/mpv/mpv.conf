# Small windowed start, never fullscreen.
fullscreen=no
autofit=480x270
geometry=480x270

# Stills are pictures, not video: image-display-duration defaults to 1, so
# without this an image flashes for a second and mpv moves on like a clip.
[still-image]
profile-desc="still image, hold it like a viewer"
profile-cond=filename and filename:lower():match('%.(png|jpe?g|gif|webp|bmp|tiff?|svgz?|avif|heiff?|hif|jxl|jp2|ico)$') ~= nil
profile-restore=copy
image-display-duration=inf
