# Small cava feed for the lock screen's album-art equalizer.
[general]
bars = 8
framerate = 30
lower_cutoff_freq = 60
higher_cutoff_freq = 12000

[output]
method = raw
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10

[smoothing]
noise_reduction = 58
monstercat = 1.2
gravity = 76
