# cava feed for the island visualizer (raw ascii stream, headless-safe).
# Fewer, slower bars than the ControlCenter feed — the island shows 5.
[general]
bars = 8
framerate = 30
lower_cutoff_freq = 50
higher_cutoff_freq = 12000

[output]
method = raw
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10

[smoothing]
noise_reduction = 62
monstercat = 1.4
gravity = 80
