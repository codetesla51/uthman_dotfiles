# Viewer bindings live under [still-image] (scoped to the image profile in
# mpv.conf) — video keeps stock keys (wheel = volume, arrows = seek).
# Images: wheel/+/- zoom, arrows pan, r resets the view, q closes.

[still-image]
WHEEL_UP add video-zoom 0.1
WHEEL_DOWN add video-zoom -0.1
+ add video-zoom 0.1
- add video-zoom -0.1
UP add video-pan-y -0.05
DOWN add video-pan-y 0.05
LEFT add video-pan-x -0.05
RIGHT add video-pan-x 0.05
r set video-zoom 0 ; set video-pan-x 0 ; set video-pan-y 0
