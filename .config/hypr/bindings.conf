# Application bindings
bindd = SUPER, RETURN, Terminal, exec, uwsm-app -- ghostty
bindd = SUPER SHIFT, F, File manager, exec, uwsm-app -- filemanager --gui
bindd = SUPER SHIFT, B, Browser, exec, xdg-open https://google.com
bindd = SUPER SHIFT ALT, B, Browser (private), exec, sh -c 'xdg-open https://google.com || firefox --private-window'
bindd = SUPER SHIFT, M, Music, exec, uwsm-app -- spotify
bindd = SUPER SHIFT, N, Editor, exec, uwsm-app -- zed
bindd = SUPER SHIFT, D, Docker, exec, uwsm-app -- ghostty -e lazydocker
bindd = SUPER SHIFT, G, Signal, exec, uwsm-app -- signal-desktop
bindd = SUPER SHIFT, O, Obsidian, exec, uwsm-app -- obsidian -disable-gpu --enable-wayland-ime
bindd = SUPER SHIFT, W, Typora, exec, uwsm-app -- typora --enable-wayland-ime
bindd = SUPER SHIFT, SLASH, Passwords, exec, uwsm-app -- 1password

# If your web app url contains #, type it as ## to prevent hyprland treating it as a comment
bindd = SUPER SHIFT, A, ChatGPT, exec, xdg-open https://chatgpt.com
bindd = SUPER SHIFT ALT, A, Grok, exec, xdg-open https://grok.com
bindd = SUPER SHIFT, C, Calendar, exec, xdg-open https://app.hey.com/calendar/weeks/
bindd = SUPER SHIFT, E, Email, exec, xdg-open https://app.hey.com
bindd = SUPER SHIFT, Y, YouTube, exec, xdg-open https://youtube.com/
bindd = SUPER SHIFT ALT, G, WhatsApp, exec, xdg-open https://web.whatsapp.com/
bindd = SUPER SHIFT CTRL, G, Google Messages, exec, xdg-open https://messages.google.com/web/conversations
bindd = SUPER SHIFT, P, Google Photos, exec, xdg-open https://photos.google.com/
bindd = SUPER SHIFT, X, X, exec, xdg-open https://x.com/
bindd = SUPER SHIFT ALT, X, X Post, exec, xdg-open https://x.com/compose/post

# Overwrite existing bindings, like putting Omarchy Menu on Super + Space
# unbind = SUPER, SPACE
unbind = SUPER ALT, SPACE

# Personal launcher: rofi drun — single-press fix: use bind + sh -c to avoid IPC race/description delay
unbind = SUPER, SPACE
unbind = SUPER ALT, SPACE
unbind = SUPER,H
unbind = SUPER,U
unbind = SUPER,C
unbind = SUPER ALT,B
bind = SUPER, SPACE, exec, sh -c "quickshell -p ~/.config/quickshell ipc call launcher toggle"
bind = SUPER, H, exec, sh -c "quickshell -p ~/.config/quickshell ipc call wifi toggle"
bind = SUPER, U, exec, sh -c "quickshell -p ~/.config/quickshell ipc call sysmon toggle"
bind = SUPER ALT, B, exec, sh -c "quickshell -p ~/.config/quickshell ipc call battery toggle"

# Personal emoji picker: rofi
unbind = SUPER CTRL, E
bindd = SUPER CTRL, E, Emoji picker, exec, uwsm-app -- ~/.config/rofi/emoji.sh

# Personal clipboard manager: rofi + cliphist
unbind = SUPER CTRL, V
unbind = SUPER CTRL,V
bind = SUPER CTRL, V, exec, sh -c "quickshell -p ~/.config/quickshell ipc call clipboard toggle"

# Personal keybindings browser: rofi
unbind = SUPER, K
unbind = SUPER,K
bind = SUPER, K, exec, sh -c "quickshell -p ~/.config/quickshell ipc call keybinds toggle"

# PDF Viewer — SUPER ALT N (SUPER J reverted to focus down)
bind = SUPER ALT, N, exec, sh -c "quickshell -p ~/.config/quickshell ipc call pdfviewer toggle"

# Wallshelf — Wallhaven browser (SUPER ALT W)
bind = SUPER ALT, W, exec, sh -c "quickshell -p ~/.config/quickshell ipc call wallshelf toggle"

# Workspace Manager — SUPER ALT O
bind = SUPER ALT, O, exec, sh -c "quickshell -p ~/.config/quickshell ipc call wsview toggle"

# ── Notifications ─────────────────────────────────────────────────────
bindd = SUPER, COMMA, Notification center, exec, sh -c "quickshell -p ~/.config/quickshell ipc call notifications toggle"
bindd = SUPER SHIFT, COMMA, Toggle do not disturb, exec, sh -c "quickshell -p ~/.config/quickshell ipc call notifications toggleDnd"
bindd = SUPER CTRL, COMMA, Notification center, exec, sh -c "quickshell -p ~/.config/quickshell ipc call notifications toggle"
unbind = SUPER ALT,COMMA
unbind = SUPER SHIFT ALT,COMMA
unbind = SUPER SHIFT ALT, COMMA
unbind = SUPER,E
unbind = SUPER,N
unbind = SUPER ALT,V
bind = SUPER ALT, COMMA, exec, sh -c "quickshell -p ~/.config/quickshell ipc call notifications toggle"
bindd = SUPER SHIFT ALT, COMMA, Notification center, exec, sh -c "quickshell -p ~/.config/quickshell ipc call notifications toggle"
bind = SUPER, E, exec, sh -c "quickshell -p ~/.config/quickshell ipc call theme toggle"
bind = SUPER, N, exec, sh -c "quickshell -p ~/.config/quickshell ipc call fastfetch toggle"

# --- fn-row media keys → quickshell OSD ---
# kill duplicate Omarchy/swayosd binds (vendor uses bindeld without space after comma)
unbind = ,XF86AudioRaiseVolume
unbind = ,XF86AudioLowerVolume
unbind = ,XF86AudioMute
unbind = ,XF86AudioMicMute
unbind = ,XF86MonBrightnessUp
unbind = ,XF86MonBrightnessDown
unbind = SHIFT,XF86MonBrightnessUp
unbind = SHIFT,XF86MonBrightnessDown
unbind = ALT,XF86AudioRaiseVolume
unbind = ALT,XF86AudioLowerVolume
unbind = ALT,XF86MonBrightnessUp
unbind = ALT,XF86MonBrightnessDown
# also try with space variant (covers both forms)
unbind = , XF86AudioRaiseVolume
unbind = , XF86AudioLowerVolume
unbind = , XF86AudioMute
unbind = , XF86AudioMicMute
unbind = , XF86MonBrightnessUp
unbind = , XF86MonBrightnessDown
bindd = , XF86AudioRaiseVolume, Volume up, exec, quickshell -p ~/.config/quickshell ipc call media volup
bindd = , XF86AudioLowerVolume, Volume down, exec, quickshell -p ~/.config/quickshell ipc call media voldown
bindd = , XF86AudioMute, Mute toggle, exec, quickshell -p ~/.config/quickshell ipc call media volmute
bindd = , XF86AudioMicMute, Mic mute toggle, exec, quickshell -p ~/.config/quickshell ipc call media micmute
bindd = , XF86MonBrightnessUp, Brightness up, exec, quickshell -p ~/.config/quickshell ipc call media briup
bindd = , XF86MonBrightnessDown, Brightness down, exec, quickshell -p ~/.config/quickshell ipc call media bridown
bindd = SHIFT, XF86MonBrightnessUp, Brightness maximum, exec, quickshell -p ~/.config/quickshell ipc call media brimax
bindd = SHIFT, XF86MonBrightnessDown, Brightness minimum, exec, quickshell -p ~/.config/quickshell ipc call media brimin
bindd = ALT, XF86AudioRaiseVolume, Volume up precise, exec, quickshell -p ~/.config/quickshell ipc call media volup
bindd = ALT, XF86AudioLowerVolume, Volume down precise, exec, quickshell -p ~/.config/quickshell ipc call media voldown

# Screen recording — local toggle (gpu-screen-recorder, saves ~/Videos/Recordings)
bindd = SUPER, R, Screen record toggle, exec, uwsm-app -- record

unbind = SUPER, ESCAPE
unbind = SUPER,Escape
unbind = , XF86PowerOff
unbind = ,XF86PowerOff
bind = SUPER, Escape, exec, sh -c "quickshell -p ~/.config/quickshell ipc call power toggle"

# ── Power — shutdown/reboot (SUPER+SHIFT+Q/R) ────────────────────────────────
bindd = SUPER SHIFT, Q, Shut down, exec, systemctl poweroff
bindd = SUPER SHIFT, R, Reboot, exec, systemctl reboot


# ── Control Center — regular Hyprland window (SUPER ALT P) — REPLACES old PluginMenu bind
# PluginMenu remains available as `quickshell -p ~/.config/quickshell ipc call plugins toggle`
# SUPER ALT P opens control-center as a normal floating window (bento: now playing + weather / controls / pet+activity+calendar / notes / github)
unbind = SUPER ALT,P
unbind = SUPER ALT,T
unbind = SUPER ALT,K
bind = SUPER ALT, P, exec, sh -c "quickshell -p ~/.config/quickshell ipc call controlcenter toggle"
bind = SUPER ALT, T, exec, sh -c "quickshell -p ~/.config/quickshell ipc call screentime toggle"
bind = SUPER ALT, K, exec, sh -c "quickshell -p ~/.config/quickshell ipc call phonebridge toggle"
bind = SUPER ALT, D, exec, sh -c "quickshell -p ~/.config/quickshell ipc call drives toggle"
bind = SUPER ALT, Y, exec, sh -c "quickshell -p ~/.config/quickshell ipc call watchcat toggle"
# full reload of quickshell + hyprland (SUPER HOME) — kill+restart quickshell so every module re-reads
bind = SUPER, HOME, exec, sh -c "hyprctl reload >/dev/null 2>&1; pkill -x quickshell; sleep 0.3; setsid quickshell -p ~/.config/quickshell >/dev/null 2>&1 &"

# ── Bar sides toggle — SUPER SHIFT SPACE leaves middle island
unbind = SUPER CTRL, SPACE
unbind = SUPER CTRL,SPACE
bind = SUPER SHIFT, SPACE, exec, sh -c "quickshell -p ~/.config/quickshell ipc call bar toggle"

# ── Island style — SUPER ALT SPACE flips Dynamic Island against the trapezoid tab
bindd = SUPER ALT, SPACE, Island style, exec, sh -c "quickshell -p ~/.config/quickshell ipc call bar toggleIsland"

# ── Package Manager — Hyprland window (SUPER+I)
unbind = SUPER,I
bind = SUPER, I, exec, sh -c "quickshell -p ~/.config/quickshell ipc call pkgman toggle"

# ── Quick Notes — now via Plugin Menu (SUPER ALT P → Quick Notes)
