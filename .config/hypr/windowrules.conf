# System Monitor — quickshell floating window
windowrule = float on, match:class quickshell, match:title System Monitor
windowrule = center on, match:class quickshell, match:title System Monitor
windowrule = size 920 640, match:class quickshell, match:title System Monitor

# Package Manager — quickshell floating window (Hyprland window, not popup)
windowrule = float on, match:class quickshell, match:title Package Manager
windowrule = center on, match:class quickshell, match:title Package Manager
windowrule = size 980 640, match:class quickshell, match:title Package Manager
windowrule = float on, match:class org.quickshell, match:title Package Manager
windowrule = center on, match:class org.quickshell, match:title Package Manager
windowrule = size 980 640, match:class org.quickshell, match:title Package Manager

# uthmanHabit — habit tracker Hyprland window (small)
windowrule = float on, match:class org.quickshell, match:title uthmanHabit
windowrule = center on, match:class org.quickshell, match:title uthmanHabit
windowrule = size 440 440, match:class org.quickshell, match:title uthmanHabit

# Screensaver — ghostty fullscreen, no decorations
windowrule = float on, match:class org.screensaver
windowrule = fullscreen on, match:class org.screensaver

