# Hyprland — standalone (no Omarchy required, but compatible)
# Vendored defaults live in ~/.config/hypr/vendor/ (copied from Omarchy, sanitized)
# Theme — standalone

# ── Theme ─────────────────────────────────────────────────────────
source = ~/.config/theme/current/colors.conf

# ── Vendor defaults (standalone) ──────────────────────────────────
source = ~/.config/hypr/vendor/autostart.conf
source = ~/.config/hypr/vendor/bindings/media.conf
source = ~/.config/hypr/vendor/bindings/clipboard.conf
source = ~/.config/hypr/vendor/bindings/tiling-v2.conf
source = ~/.config/hypr/vendor/bindings/utilities.conf
source = ~/.config/hypr/vendor/envs.conf
source = ~/.config/hypr/vendor/looknfeel.conf
source = ~/.config/hypr/vendor/input.conf
source = ~/.config/hypr/vendor/windows.conf
source = ~/.config/theme/current/hyprland.conf


# ── Personal overrides ────────────────────────────────────────────
source = ~/.config/hypr/envs.conf
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/input.conf
source = ~/.config/hypr/bindings.conf
source = ~/.config/hypr/looknfeel.conf
source = ~/.config/hypr/autostart.conf

# Add any other personal Hyprland configuration below
# windowrule = workspace 5, match:class qemu

source = ~/.config/hypr/windowrules.conf
