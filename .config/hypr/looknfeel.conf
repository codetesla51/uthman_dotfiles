# ── General ───────────────────────────────────────────────────
general {
    gaps_in = 4
    gaps_out = 10
    border_size = 0
    col.active_border   = $primary $secondary 45deg
    col.inactive_border = $outline
    layout = dwindle
    resize_on_border = true
}

# ── Decoration ────────────────────────────────────────────────
decoration {
    rounding = 12
    rounding_power = 2.4

    blur {
        enabled = true
        size = 12
        passes = 4
        new_optimizations = true
        xray = false
        # true: blur translucent-by-rule windows too. Zathura/GTK reports an
        # opaque surface, so opacity alone never reached the blur pass.
        ignore_opacity = true
        popups = true
    }

    shadow {
        enabled = true
        range = 28
        render_power = 3
        color = rgba(00000066)
        color_inactive = rgba(00000025)
    }

    active_opacity   = 0.95
    inactive_opacity = 0.86
    fullscreen_opacity = 1.0

    dim_inactive = true
    dim_strength = 0.08
}

# ── Animations ────────────────────────────────────────────────
animations {
    enabled = true

    # Same motion language as the quickshell Bloom/Magnet preset:
    # a gentle 1.12 overshoot on entrance, ease-out on exit, and no hard stops.
    bezier = magnet,     0.33, 1.12, 0.58, 1.0
    bezier = magnetSoft, 0.34, 1.06, 0.64, 1.0
    bezier = easeOut,    0.32, 0.72, 0.0,  1.0
    bezier = apple,      0.22, 1.0,  0.36, 1.0

    animation = windows,          1, 2.6, magnetSoft
    animation = windowsIn,        1, 2.4, apple
    animation = windowsOut,       1, 1.4, easeOut
    animation = windowsMove,      1, 2.2, magnetSoft
    animation = fadeIn,           1, 2.0, apple
    animation = fadeOut,          1, 1.3, easeOut
    animation = fade,             1, 1.8, magnetSoft
    animation = border,           1, 3.0, magnetSoft
    animation = borderangle,      1, 5,   magnetSoft,  once
    animation = workspaces,       1, 3.0, magnet,      slidefadevert
    animation = specialWorkspace, 1, 2.6, magnetSoft,  slidevert
    animation = layersIn,         1, 2.0, magnetSoft,  fade
    animation = layersOut,        1, 1.3, easeOut,     fade
    animation = fadeLayersIn,     1, 1.8, magnetSoft
    animation = fadeLayersOut,    1, 1.2, easeOut
}

# ── Dwindle layout ────────────────────────────────────────────
dwindle {
    preserve_split = true
    smart_split    = true
    smart_resizing = true
}

# ── Master layout ─────────────────────────────────────────────
# Only active when `layout = master` (SUPER ALT Z cycles layouts). Hyprland's
# default is new_status = master, so every new window evicts the big pane;
# slave sends it to the stack instead. mfact/orientation defaults (0.55/left)
# are already what we want, so they are left alone. `scrolling` needs no
# section either — its defaults (column_width 0.49, follow_focus on) are fine.
master {
    new_status = slave
}

# ── Misc ──────────────────────────────────────────────────────
misc {
    disable_hyprland_logo   = true
    disable_splash_rendering = true
    animate_manual_resizes  = true
    animate_mouse_windowdragging = true
    focus_on_activate       = true
    mouse_move_enables_dpms = true
    key_press_enables_dpms  = true
}

# frosted glass for quickshell surfaces (island, panels, toasts)
layerrule = blur on, match:namespace qs-bar
layerrule = ignore_alpha 0.15, match:namespace qs-bar
layerrule = blur on, match:namespace qs-launcher
layerrule = ignore_alpha 0.15, match:namespace qs-launcher
layerrule = blur on, match:namespace qs-passprompt
layerrule = ignore_alpha 0.15, match:namespace qs-passprompt
layerrule = blur on, match:namespace qs-nowplaying
layerrule = ignore_alpha 0.15, match:namespace qs-nowplaying
layerrule = blur on, match:namespace qs-notes
layerrule = ignore_alpha 0.15, match:namespace qs-notes
layerrule = blur on, match:namespace qs-wifi
layerrule = ignore_alpha 0.15, match:namespace qs-wifi
layerrule = blur on, match:namespace qs-notify
layerrule = ignore_alpha 0.15, match:namespace qs-notify
layerrule = blur on, match:namespace qs-toasts
layerrule = ignore_alpha 0.15, match:namespace qs-toasts
layerrule = blur on, match:namespace qs-lyrics
layerrule = ignore_alpha 0.15, match:namespace qs-lyrics
layerrule = blur on, match:namespace qs-theme

# fn-row OSD chip — blur + the alpha mask, which is what the OSD had for free
# before it got its own namespace (it used to inherit this off `quickshell`).
# ignore_alpha is what keeps the blur on the drawn outline instead of the
# rectangular layer surface.
layerrule = blur on, match:namespace qs-osd
layerrule = ignore_alpha 0.15, match:namespace qs-osd
layerrule = ignore_alpha 0.15, match:namespace qs-theme
# default-namespace panels (power, sysmon, battery, clipboard, fetch, clock,
# screentime, phone, drives, watchcat, failwatch, keybinds) share one rule
layerrule = blur on, match:namespace quickshell
layerrule = ignore_alpha 0.15, match:namespace quickshell
# Hornet pet — only PNG visible, no window bg/blur/shadow
layerrule = blur off, match:namespace qs-pet
layerrule = ignore_alpha 0.01, match:namespace qs-pet
layerrule = no_anim on, match:namespace qs-pet
layerrule = xray 1, match:namespace qs-pet
