# cava feed for the quickshell AudioVisualizer (raw ascii stream, headless-safe)
[general]
bars = 32
framerate = 120
lower_cutoff_freq = 50
higher_cutoff_freq = 12000

[output]
method = raw
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10

[smoothing]
noise_reduction = 62
monstercat = 1.4
gravity = 80
