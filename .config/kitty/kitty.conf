# kitty terminal — the only terminal; font, window, and tab-bar behavior below.
# Colors are dynamic: matugen writes
# ~/.config/theme/current/kitty.conf (template: kitty-theme.conf).
# install.sh runs matugen on first install, so the include always resolves;
# if the file is missing kitty just skips it at startup with a notice.

include ~/.config/theme/current/kitty.conf

# ── Shell (login shell is bash; force zsh for starship prompt) ──
shell /usr/bin/zsh

# ── Font ──────────────────────────────────────────────────────
font_family FiraCode Nerd Font Mono
font_size 13.0
disable_ligatures never
# Airier line rhythm + slightly wider columns (percent of the cell size)
# for a calmer, more premium reading feel.
adjust_line_height 110%
adjust_column_width 102%

# ── Window ────────────────────────────────────────────────────
window_padding_width 12 10
confirm_os_window_close 0
# 2pt border around each window. Colors come from the theme include
# (active = primary, inactive = outline) — kitty's default border is
# 0.5pt and bright green, which would look wrong with this setup.
window_border_width 2
draw_minimal_borders yes
# Startup size fallback (only matters when the WM isn't tiling you).
remember_window_size yes
initial_window_width 1000
initial_window_height 600
# ── Tab bar ───────────────────────────────────────────────────
# Custom powerline bar (tab_bar.py) with kanji numerals 一二三…
# so alt+1..9 jump matches what you read. Honors powerline round style.
tab_bar_style custom
tab_powerline_style round
tab_bar_min_tabs 1
tab_bar_edge top
tab_bar_margin_width 12
active_tab_font_style bold
inactive_tab_font_style normal
# Attention markers: a bell in the tab when a program rings the bell,
# a dot when a background tab receives output. Rendered in the theme's
# error tone via tab_title_template (from the matugen include).
bell_on_tab "🔔 "
tab_activity_symbol "● "

# ── Scrollback ────────────────────────────────────────────────
scrollback_lines 10000
# Interactive pager (searchable, mouse-aware) instead of plain less.
scrollback_pager kitty +kitten scrollback_pager
# Faster wheel/touch scrolling through terminals.
wheel_scroll_multiplier 6.0
touch_scroll_multiplier 2.0

# ── Cursor ────────────────────────────────────────────────────
# Cursor & selection colors come from the matugen theme include above.
# Beam, no blink, for a calm premium look.
cursor_shape beam
cursor_blink_interval 0
# Cursor trail: 0 = off. ms of rest before a move triggers it; 10 = trail on
# almost every typed key. decay = fade speed (seconds), smaller = faster.
# cursor_trail_color is supplied by the matugen theme include.
cursor_trail 10
cursor_trail_decay 0.06 0.22
cursor_trail_start_threshold 1

# ── Shell integration ─────────────────────────────────────────
shell_integration no-cursor

# ── Remote control ────────────────────────────────────────────
# Allow kittens and *other* terminals (via the socket) to drive this
# kitty. "yes" also trusts escape-code control from inside kitty.
# listen_on only takes effect after a kitty restart, not a reload.
allow_remote_control yes
listen_on unix:@kitty-${USER}

# ── Opacity & focus ───────────────────────────────────────────
background_opacity 0.4
# Blur what's behind the transparent window (Hyprland blur is enabled).
# Higher = smoother, softer backdrop; kitty docs: up to 64 works well.
background_blur 30

# ── Mouse ─────────────────────────────────────────────────────
mouse_hide_wait 1.0

# ── Selection & clipboard ─────────────────────────────────────
copy_on_select clipboard
strip_trailing_spaces smart
map super+c copy_to_clipboard
map super+v paste_from_clipboard

# ── Font zoom ─────────────────────────────────────────────────
map ctrl+plus increase_font_size
map ctrl+equal increase_font_size
map ctrl+minus decrease_font_size

# ── Links ─────────────────────────────────────────────────────
detect_urls yes

# ── Performance ───────────────────────────────────────────────
# Lower input/redraw latency so keystroke → paint feels instant.
repaint_delay 5
input_delay 1

# ── Keybinds ──────────────────────────────────────────────────
map shift+insert paste_from_clipboard
map ctrl+insert copy_to_clipboard

# Send Shift+Enter as CSI-u so TUIs can distinguish it from Enter.
map shift+enter send_text all \x1b[13;2u
# Legacy encoding sends Alt+Shift+Enter the same as Alt+Enter; send CSI-u so tmux can match M-S-Enter.
map alt+shift+enter send_text all \x1b[13;4u

# Split resizing
map super+ctrl+shift+alt+down resize_window down 100
map super+ctrl+shift+alt+up resize_window up 100
map super+ctrl+shift+alt+left resize_window left 100
map super+ctrl+shift+alt+right resize_window right 100

# Split navigation
map ctrl+alt+left neighboring_window left
map ctrl+alt+right neighboring_window right
map ctrl+alt+up neighboring_window up
map ctrl+alt+down neighboring_window down

# New splits
map ctrl+shift+o split_window --location=vsplit
map ctrl+shift+e split_window --location=hsplit
map ctrl+shift+z toggle_layout stack

# Tabs
map ctrl+shift+t new_tab
map ctrl+shift+left previous_tab
map ctrl+shift+right next_tab
map ctrl+shift+w close_tab
# Jump to tab by number (Alt + 1..9)
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9

# Reload config live
map ctrl+shift+comma load_config_file